<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Green Gradient for Leaf / 'F' arm -->
    <linearGradient id="fjLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Golden Harvest Gradient for Mandi / 'J' arm -->
    <linearGradient id="fjGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Subtle Glow / Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#14532d" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left: Iconic Emblem (FJ Handshake & Sprout) -->
  <g id="logo-icon" transform="translate(14, 10)">
    <!-- Golden 'J' Arm & Sleeve -->
    <path d="M 68 18 L 84 18 C 91 18 96 23 96 30 L 96 62 C 96 76 84 86 68 86 C 56 86 46 80 43 72" 
          stroke="url(#fjGoldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Golden Hand (Offering / Connecting) -->
    <path d="M 44 71 C 49 68 56 64 63 60 C 66 58 68 62 65 65 C 62 68 58 72 52 75 Z" 
          fill="url(#fjGoldGrad)" />

    <!-- Green 'F' Arm & Crop Leaf -->
    <!-- Main stem / F spine that sweeps into a leaf -->
    <path d="M 22 84 C 18 56 22 32 38 18 C 48 10 60 8 68 8 C 65 18 58 26 48 30 C 36 35 30 46 30 62 C 30 72 35 80 44 84" 
          fill="url(#fjLeafGrad)" />
    
    <!-- Upper Leaf / Wheat Sprout Leaflet -->
    <path d="M 38 20 C 44 14 56 12 66 12 C 58 20 48 24 38 24 Z" 
          fill="#86efac" />
    <path d="M 34 32 C 42 28 52 28 60 30 C 52 35 44 36 34 36 Z" 
          fill="#4ade80" />

    <!-- Farmer Green Hand (Firm Handshake Clasp) -->
    <path d="M 30 62 C 34 62 44 58 54 54 C 58 52 61 55 58 58 C 54 62 46 68 38 72 C 34 74 30 68 30 62 Z" 
          fill="#15803d" />

    <!-- Wheat grains inside leaf -->
    <ellipse cx="44" cy="18" rx="2.5" ry="5" transform="rotate(-35 44 18)" fill="#fef08a" />
    <ellipse cx="52" cy="15" rx="2.5" ry="5.5" transform="rotate(-25 52 15)" fill="#fef08a" />
    <ellipse cx="60" cy="13" rx="2" ry="4.5" transform="rotate(-15 60 13)" fill="#fef08a" />
  </g>

  <!-- Right: Typography & Punchline -->
  <g id="logo-text" transform="translate(132, 0)">
    <!-- Brand Title: FASAL JUNCTION -->
    <text x="0" y="52" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Montserrat, Arial, sans-serif" 
          font-size="38" 
          font-weight="900" 
          letter-spacing="1.5" 
          fill="#14532d">
      FASAL <tspan fill="#16a34a">JUNCTION</tspan>
    </text>

    <!-- Sleek Gradient Divider Line -->
    <rect x="0" y="64" width="370" height="3" rx="1.5" fill="url(#fjLeafGrad)" />
    <!-- Golden Accent Pip on Divider -->
    <circle cx="16" cy="65.5" r="3.5" fill="#f59e0b" />

    <!-- Punchline: आपका खेत, आपका बाजार -->
    <text x="30" y="94" 
          font-family="'Noto Sans Devanagari', 'Mangal', 'Poppins', 'Segoe UI', Arial, sans-serif" 
          font-size="22" 
          font-weight="700" 
          letter-spacing="0.5" 
          fill="#1b4332">
      आपका खेत, आपका बाजार
    </text>
  </g>
</svg>
